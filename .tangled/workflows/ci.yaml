when:
  - event: ["push"]
    branch: ["main"]
  - event: ["pull_request"]
    branch: ["main"]

engine: "nixery"

dependencies:
  nixpkgs:
    - emacs30
    - curl
    - cacert
    - which

steps:
  - name: "Install Eldev"
    command: |
      export SSL_CERT_FILE="/etc/ssl/certs/ca-bundle.crt"
      export NIX_SSL_CERT_FILE="$SSL_CERT_FILE"
      export CURL_CA_BUNDLE="$SSL_CERT_FILE"
      curl -fsSL https://raw.github.com/emacs-eldev/eldev/master/webinstall/eldev | sh
      export PATH="$HOME/.local/bin:$PATH"
      eldev --version

  - name: "Install tree-sitter grammars"
    command: |
      export SSL_CERT_FILE="/etc/ssl/certs/ca-bundle.crt"
      export NIX_SSL_CERT_FILE="$SSL_CERT_FILE"
      export PATH="$HOME/.local/bin:$PATH"
      eldev eval '(curry-install-grammars)'
      eldev eval '(progn (load "curry-cabal-mode") (curry-cabal-install-grammar))'

  - name: "Byte-compile"
    command: |
      export SSL_CERT_FILE="/etc/ssl/certs/ca-bundle.crt"
      export NIX_SSL_CERT_FILE="$SSL_CERT_FILE"
      export PATH="$HOME/.local/bin:$PATH"
      eldev byte-compile --warnings-as-errors

  - name: "Test"
    command: |
      export SSL_CERT_FILE="/etc/ssl/certs/ca-bundle.crt"
      export NIX_SSL_CERT_FILE="$SSL_CERT_FILE"
      export PATH="$HOME/.local/bin:$PATH"
      eldev test

  - name: "Lint"
    command: |
      export SSL_CERT_FILE="/etc/ssl/certs/ca-bundle.crt"
      export NIX_SSL_CERT_FILE="$SSL_CERT_FILE"
      export PATH="$HOME/.local/bin:$PATH"
      eldev lint
